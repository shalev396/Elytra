$kind: http-request
url: '{{baseUrl}}/private/me/export'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{idToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Response carries a presigned download URL', function () {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
          const json = pm.response.json();
          pm.expect(json).to.not.have.property('success');
          pm.expect(json.data.downloadUrl).to.be.a('string');
          pm.expect(json.data.downloadUrl).to.match(/^https:\/\//);
          pm.expect(json.data.filename).to.match(/^user-export-\d+\.zip$/);
      });

      console.log('Flow complete - export download URL received');
    language: text/javascript
order: 3000
