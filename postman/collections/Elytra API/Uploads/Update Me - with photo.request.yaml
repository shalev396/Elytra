$kind: http-request
url: '{{baseUrl}}/private/me'
method: PUT
auth:
  type: inherit
  credentials:
    id: 383fc78f-96ef-47d9-81d5-e4c7dada7326
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"photo":{"stagingKey":"{{stagingKey}}","fileName":"test-image.png"}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('The photo is served from media/users/<id>/', function () {
          const json = pm.response.json();
          pm.expect(json.data.photoUrl).to.be.a('string');
          pm.expect(json.data.photoUrl).to.match(/\/media\/users\/[^/]+\/[^/]+\.png$/);
      });
    language: text/javascript
order: 5000
